name: Daily Menu Scrape

on:
  schedule:
    - cron: '0 11 * * *'   # 7am EST Monday-Sunday
  workflow_dispatch:          # lets you trigger it manually from GitHub too

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: npm run scrape

      - name: Commit and push meals.json
        run: |
          git config user.email "singj93@mcmaster.ca"
          git config user.name "MacroMac Bot"
          git add meals.json
          git diff --staged --quiet || git commit -m "menu update $(date +'%Y-%m-%d')"
          git push
